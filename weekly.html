<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Stats — CA Trading Team Atomic Habit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Caveat:wght@500;600&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-wrapper">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-lockup">
        <img src="images/logo.png" alt="CA Trading" class="brand-logo">
        <span class="brand-name">FitLog</span>
      </div>
      <div class="brand-tagline">"Small daily logs, compound long-term gains."</div>
    </div>
    <nav class="nav">
      <a class="nav-button" href="index.html">Daily</a>
      <a class="nav-button active" href="weekly.html">Stats</a>
      <a class="nav-button" href="stats.html">Achievement</a>
      <a class="nav-button" href="register.html">Users Registration</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="page-title">Stats</div>
    <div class="page-subtitle">Per-activity history vs your daily targets</div>

    <div id="config-warning" class="config-warning" style="display:none;">
      Not connected to a database yet. Open <code>js/supabase-client.js</code> and paste in your Supabase URL and anon key.
    </div>

    <div class="section-label">Select who</div>
    <div class="user-grid" id="user-grid"></div>

    <div id="stats-panel" style="display:none;">
      <div class="profile-card">
        <div class="profile-avatar-big" id="profile-avatar"></div>
        <div>
          <div class="profile-name" id="profile-name"></div>
          <div class="profile-bio" id="profile-bio"></div>
        </div>
      </div>

      <div class="scrawl-summary" id="scrawl-summary"></div>

      <div class="card" style="margin-bottom:20px;">
        <div class="period-picker">
          <span class="section-label" style="margin-bottom:0;">Period</span>
          <button class="period-btn active" data-period="week">This Week</button>
          <button class="period-btn" data-period="month">This Month</button>
          <button class="period-btn" data-period="all">Since Day One</button>
        </div>
      </div>

      <div id="activity-charts"></div>
    </div>

    <div id="no-user-hint" class="no-user-hint">
      <img src="images/cat3.png" alt="Click a name above to see their stats" class="cat-hint-img">
    </div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/weekly.js?v=7"></script>
</body>
</html>
